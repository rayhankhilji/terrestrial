[project]
name = "terrestrial"
version = "0.1.0"
description = "Dark-vessel detection, verification and tracking for the Black Sea: AIS gaps fused with satellite radar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "huggingface-hub>=2.1.1",
    "networkx>=3.6.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.1",
    "sgp4>=2.27",
    "shapely>=2.0",
    "uvicorn[standard]>=0.30",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m \"not graph\""
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "graph: needs a running TuringDB server (docker compose up -d turingdb)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Long user-facing strings are clearer unwrapped; the formatter owns code line length.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]
