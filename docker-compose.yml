# TuringDB graph server for Terrestrial's network layer.
#   docker compose up -d turingdb    REST API on :6666, graph visualiser on :8080
#   docker compose down
# ./data/turing is the server's -turing-dir: graphs/ holds committed graphs and
# data/ is where the pipeline drops JSONL files for LOAD JSONL.
services:
  turingdb:
    image: turingdbai/turingdb:3.0
    container_name: terrestrial-turingdb
    ports:
      - "6666:6666"
      - "8080:8080"
    volumes:
      - ./data/turing:/home/ubuntu/.turing
    # The image's default entrypoint runs the server's interactive console in the
    # foreground, which exits when its terminal goes away. Run the server as a daemon
    # (plus the visualiser's static server) and keep the container alive instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        serve -s "$$TURINGDB_VIS_DIR" -l "tcp://127.0.0.1:$$TURINGDB_VIS_PORT" >/tmp/visualizer.log 2>&1 &
        turingdb start -i 0.0.0.0 -p 6666 -ui -demon -start-timeout 10000 &&
        exec sleep infinity
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:6666/query", "-d", "LIST GRAPH"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
